<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#0b001a"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg-grad)" stroke="url(#cyan-glow)" stroke-width="2"/>

  <!-- Synthwave Sun -->
  <circle cx="32" cy="28" r="16" fill="url(#sun-grad)"/>

  <!-- Sun Lines Grid -->
  <rect x="14" y="24" width="36" height="2" fill="#0b001a"/>
  <rect x="14" y="28" width="36" height="2.5" fill="#0b001a"/>
  <rect x="14" y="33" width="36" height="3" fill="#0b001a"/>

  <!-- Palm Tree Silhouette -->
  <!-- Trunk -->
  <path d="M 30,52 Q 28,40 33,26" stroke="#00f0ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M 33,26 Q 24,18 16,22" stroke="#ff00aa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 33,26 Q 22,26 14,32" stroke="#ff00aa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 33,26 Q 42,18 50,22" stroke="#ff00aa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 33,26 Q 44,26 52,32" stroke="#ff00aa" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 33,26 Q 33,14 31,10" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- GTA Vice Star -->
  <polygon points="48,12 50,16 54,16 51,19 52,23 48,20 44,23 45,19 42,16 46,16" fill="#ffea00"/>
</svg>
